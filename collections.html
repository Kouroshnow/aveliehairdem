<main><section class="hero"><h1>Collections</h1><p>Minimal product cards in one pink-white system. Open any product for shade, length, weight, save, and bag controls.</p></section><section class="bar" id="collections"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="clip">Clip-In</button><button class="filter" data-filter="tape">Tape-In</button><button class="filter" data-filter="halo">Halo</button></section><section class="grid" id="grid"></section></main>

<script>
const products=[{name:"Rose Veil",kind:"clip",type:"Seamless Clip-In",price:329,grams:"180G",length:"20",colors:["#fdf0e6","#d9a06b","#e8899e"],swatches:[["Rose Gold","#d9a06b"],["Blush","#e8899e"],["Champagne","#e8c9a8"],["Pearl","#fdf6f3"]],lengths:["16","18","20","22","24"],weights:["120G","160G","180G","220G"]},{name:"Blush Flow",kind:"tape",type:"Soft Wave Tape-In",price:289,grams:"160G",length:"20",colors:["#fff2ec","#e8c9a8","#e8899e"],swatches:[["Blush","#e8899e"],["Rose Gold","#d9a06b"],["Shell","#f6d8cf"],["White","#fff"]],lengths:["16","18","20","22"],weights:["100G","140G","160G","200G"]},{name:"Pearl Halo",kind:"halo",type:"Halo Crown Extension",price:259,grams:"140G",length:"18",colors:["#fdf6f3","#f6d8cf","#e8c9a8"],swatches:[["Pearl","#fdf6f3"],["Champagne","#e8c9a8"],["Rose Gold","#d9a06b"],["Blush","#e8899e"]],lengths:["14","16","18","20"],weights:["100G","120G","140G","180G"]},{name:"Soft Silk",kind:"clip",type:"Classic Clip-In",price:319,grams:"180G",length:"22",colors:["#fff","#f6d8cf","#d9a06b"],swatches:[["White","#fff"],["Shell","#f6d8cf"],["Rose Gold","#d9a06b"]],lengths:["18","20","22","24"],weights:["160G","180G","220G"]}];
let active=0,shade=0,len="",weight="",filter="all",toastTimer;const cart=JSON.parse(localStorage.getItem("avelie-cart")||"[]"),saved=new Set(JSON.parse(localStorage.getItem("avelie-wishlist")||"[]")),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function persistWishlist(){localStorage.setItem("avelie-wishlist",JSON.stringify([...saved]));updateWish()}
function persistCart(){localStorage.setItem("avelie-cart",JSON.stringify(cart))}
function updateWish(){wishCount.textContent=saved.size;wishCount.style.display=saved.size?"grid":"none"}
function hair(p){return`<div class="hair" style="--lo:${p.colors[0]};--mid:${p.colors[1]};--hi:${p.colors[2]}"><i class="lock"></i><i class="lock"></i><i class="lock"></i><i class="lock"></i><i class="lock"></i></div>`}
function note(t){toast.textContent=t;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),1600)}
function render(){grid.innerHTML=products.map((p,i)=>({...p,i})).filter(p=>filter==="all"||p.kind===filter).map(p=>`<article class="card"><button class="art" data-open="${p.i}">${hair(p)}</button><div class="body"><div class="eyebrow">${p.type}</div><h2>${p.name}</h2><p>${p.length}" / ${p.grams}</p><div class="meta"><span class="price">$${p.price}.00</span><div class="swatches">${p.swatches.slice(0,4).map(s=>`<i class="dot" style="--c:${s[1]}"></i>`).join("")}</div></div><div class="card-actions"><button class="btn fill" data-open="${p.i}">View Product</button><button class="save ${saved.has(p.name)?"saved":""}" data-save="${p.i}" aria-label="Save to wishlist"><svg width="16" height="16" viewBox="0 0 24 24" fill="${saved.has(p.name)?"currentColor":"none"}" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.35-9.5-8.8C.87 7.6 2.4 4 6 4c2 0 3.4 1.1 4 2.4C10.6 5.1 12 4 14 4c3.6 0 5.13 3.6 3.5 7.2C19 15.65 12 20 12 20z"/></svg></button></div></div></article>`).join("");$$("[data-open]").forEach(b=>b.onclick=()=>openProduct(+b.dataset.open));$$("[data-save]").forEach(b=>b.onclick=()=>toggleSave(+b.dataset.save));const reveal=new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target)}}),{threshold:.15});$$(".card").forEach(c=>reveal.observe(c))}
function showLayer(){overlay.hidden=false;requestAnimationFrame(()=>overlay.classList.add("show"))}
function closeAll(){drawer.classList.remove("open");modal.classList.remove("open");overlay.classList.remove("show");setTimeout(()=>overlay.hidden=true,280)}
function openProduct(i){active=i;const p=products[i];shade=0;len=p.length;weight=p.grams;showLayer();modal.innerHTML=`<div class="detail"><div class="art">${hair(p)}</div><div class="info"><div class="top"><h3>${p.name}</h3><button class="close" data-close>×</button></div><p>${p.type}</p><div class="meta"><span class="price">$${p.price}.00</span><button class="save wide ${saved.has(p.name)?"saved":""}" data-save-modal>${saved.has(p.name)?"Saved":"Save"}</button></div><div class="option"><div class="label"><span>Shade</span><span id="shadeText">${p.swatches[0][0]}</span></div><div class="swatches">${p.swatches.map((s,n)=>`<button class="dot" style="--c:${s[1]}" data-shade="${n}" aria-label="${s[0]}"></button>`).join("")}</div></div><div class="option"><div class="label"><span>Length</span><span id="lenText">${len}"</span></div><div class="pills">${p.lengths.map(v=>`<button class="pill len ${v===len?"active":""}" data-v="${v}">${v}"</button>`).join("")}</div></div><div class="option"><div class="label"><span>Weight</span><span id="weightText">${weight}</span></div><div class="pills">${p.weights.map(v=>`<button class="pill weight ${v===weight?"active":""}" data-v="${v}">${v}</button>`).join("")}</div></div><button class="btn fill" id="addBag">Add To Bag</button></div></div>`;modal.classList.add("open");modal.setAttribute("aria-hidden","false");bindModal()}
function bindModal(){const p=products[active];$$("[data-shade]").forEach(b=>b.onclick=()=>{shade=+b.dataset.shade;shadeText.textContent=p.swatches[shade][0];note(`${p.swatches[shade][0]} selected`)});$$(".len").forEach(b=>b.onclick=()=>{len=b.dataset.v;$$(".len").forEach(x=>x.classList.remove("active"));b.classList.add("active");lenText.textContent=`${len}"`});$$(".weight").forEach(b=>b.onclick=()=>{weight=b.dataset.v;$$(".weight").forEach(x=>x.classList.remove("active"));b.classList.add("active");weightText.textContent=weight});$("[data-close]").onclick=closeAll;$("[data-save-modal]").onclick=()=>toggleSave(active);addBag.onclick=()=>{cart.push({name:p.name,shade:p.swatches[shade][0],len,weight,price:p.price});persistCart();updateBag();modal.classList.remove("open");openBag();note(`${p.name} added`)}}
function toggleSave(i){const p=products[i];saved.has(p.name)?saved.delete(p.name):saved.add(p.name);persistWishlist();render();if(modal.classList.contains("open"))openProduct(i);note(saved.has(p.name)?"Added to wishlist":"Removed from wishlist")}
function openWish(){showLayer();const items=products.filter(p=>saved.has(p.name));drawer.innerHTML=`<div class="top"><h3>Your Wishlist</h3><button class="close" data-close>×</button></div>${items.length?items.map(p=>`<div class="cart-line"><button data-result="${products.indexOf(p)}" style="text-align:left"><strong>${p.name}</strong><br><small>${p.type} / $${p.price}.00</small></button><button data-unsave="${products.indexOf(p)}" aria-label="Remove from wishlist">×</button></div>`).join(""):"<p>Your wishlist is empty.</p>"}`;drawer.classList.add("open");$("[data-close]").onclick=closeAll;$$("[data-unsave]").forEach(b=>b.onclick=()=>{toggleSave(+b.dataset.unsave);openWish()})}
function updateBag(){bagCount.textContent=cart.length;bagCount.style.display=cart.length?"grid":"none"}
function openBag(){showLayer();drawer.innerHTML=`<div class="top"><h3>Your Bag</h3><button class="close" data-close>×</button></div>${cart.length?cart.map((i,n)=>`<div class="cart-line"><div><strong>${i.name}</strong><br><small>${i.shade} / ${i.len}" / ${i.weight}</small></div><button data-remove="${n}">×</button></div>`).join(""):"<p>Your bag is empty.</p>"}<div class="total"><span>Total</span><span>$${cart.reduce((n,i)=>n+i.price,0)}.00</span></div><button class="btn fill" id="checkout">Checkout Preview</button>`;drawer.classList.add("open");$("[data-close]").onclick=closeAll;$$("[data-remove]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);persistCart();updateBag();openBag()});checkout.onclick=()=>note("Checkout ready")}
function openSearch(){showLayer();drawer.innerHTML=`<div class="top"><h3>Search</h3><button class="close" data-close>×</button></div><input class="search" id="search" placeholder="Search clip, halo, tape" aria-label="Search"><div id="results"></div>`;drawer.classList.add("open");$("[data-close]").onclick=closeAll;search.oninput=()=>{const q=search.value.toLowerCase();results.innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)||p.type.toLowerCase().includes(q)||p.kind.includes(q)).map(p=>`<button class="cart-line" data-result="${products.indexOf(p)}"><strong>${p.name}</strong><span>$${p.price}</span></button>`).join("")};search.oninput();setTimeout(()=>search.focus(),50)}
$$(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});overlay.onclick=closeAll;bagBtn.onclick=openBag;wishBtn.onclick=openWish;searchBtn.onclick=openSearch;drawer.onclick=e=>{const r=e.target.closest("[data-result]");if(r){closeAll();openProduct(+r.dataset.result)}};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});render();updateBag();updateWish();
menu.onclick=()=>{const open=!document.body.classList.contains("open");document.body.classList.toggle("open",open);menu.setAttribute("aria-expanded",open);mobile.setAttribute("aria-hidden",!open)};document.querySelectorAll(".mobile a").forEach(a=>a.onclick=()=>document.body.classList.remove("open"));
