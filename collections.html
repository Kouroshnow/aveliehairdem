<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AvelieHair Collections</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23221611'/%3E%3Ctext x='32' y='41' font-size='30' text-anchor='middle' fill='%23c9a646' font-family='serif'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ef;--cream:#efe2d4;--ink:#221611;--muted:#8f6155;--gold:#c9a646;--rose:#b76d5d;--line:rgba(34,22,17,.14);--glass:rgba(255,250,245,.78);--ease:cubic-bezier(.16,1,.3,1);--serif:"Playfair Display",Georgia,serif;--sans:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;background:var(--paper);overflow-x:hidden}body{font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--paper),#f6eadf);overflow-x:hidden}a{text-decoration:none;color:inherit}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.nav{position:sticky;top:0;z-index:40;height:72px;padding:0 clamp(1rem,4vw,3rem);display:flex;align-items:center;justify-content:space-between;background:rgba(34,22,17,.95);color:var(--paper);backdrop-filter:blur(16px)}.brand{font:700 clamp(1.05rem,2vw,1.65rem)/1 var(--serif);letter-spacing:.13em;text-transform:uppercase}.brand span{color:var(--gold)}.nav a,.icon,.filter,.btn{font-size:.68rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.links{display:flex;gap:1.3rem}.links a{opacity:.82}.links a:hover{opacity:1;color:#ffe4a2}.nav-actions{display:flex;gap:.55rem}.icon{width:42px;height:42px;border:1px solid rgba(255,255,255,.17);border-radius:50%;display:grid;place-items:center;position:relative}.count{position:absolute;right:-3px;top:-4px;min-width:18px;height:18px;border-radius:20px;background:var(--gold);color:var(--ink);font-size:.62rem;display:none;place-items:center}.hero{padding:clamp(3rem,7vw,6rem) clamp(1rem,4vw,3rem) 2rem;display:flex;align-items:end;justify-content:space-between;gap:2rem}.hero h1{font:600 clamp(3rem,8vw,7rem)/.92 var(--serif);max-width:780px}.hero p{max-width:420px;color:var(--muted);line-height:1.6}.bar{display:flex;gap:.65rem;flex-wrap:wrap;padding:0 clamp(1rem,4vw,3rem) 1.4rem}.filter{min-height:40px;border:1px solid var(--line);border-radius:999px;padding:0 .95rem;background:rgba(255,250,245,.55);transition:.25s var(--ease)}.filter.active,.filter:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}.grid{padding:0 clamp(1rem,4vw,3rem) clamp(4rem,7vw,6rem);display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.card{border:1px solid var(--line);border-radius:18px;background:rgba(255,250,245,.65);overflow:hidden;transition:.35s var(--ease);position:relative}.card:hover{transform:translateY(-6px);box-shadow:0 28px 80px -54px rgba(34,22,17,.85)}.art{height:310px;background:linear-gradient(180deg,#fffaf5,var(--cream));display:grid;place-items:center;position:relative;overflow:hidden}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.45),transparent 58%);transform:translateX(-80%);transition:.65s var(--ease)}.card:hover .art:after{transform:translateX(80%)}.hair{width:72%;height:80%;position:relative;filter:drop-shadow(0 22px 18px rgba(34,22,17,.22));animation:float 5s ease-in-out infinite}.lock{position:absolute;left:50%;top:2%;width:22%;height:96%;border-radius:42% 42% 48% 48%/8% 8% 92% 92%;transform-origin:50% 0;background:linear-gradient(90deg,#fff4df,var(--hi) 18%,var(--mid) 46%,var(--lo) 70%,var(--hi))}.lock:nth-child(1){transform:translateX(-165%) rotate(-11deg);height:84%}.lock:nth-child(2){transform:translateX(-90%) rotate(-5deg);height:93%}.lock:nth-child(3){transform:translateX(-16%);height:100%}.lock:nth-child(4){transform:translateX(58%) rotate(6deg);height:93%}.lock:nth-child(5){transform:translateX(132%) rotate(12deg);height:84%}.body{padding:1rem}.eyebrow{font-size:.62rem;font-weight:800;letter-spacing:.15em;color:var(--rose);text-transform:uppercase}.body h2{font:600 2rem/1 var(--serif);margin:.35rem 0}.body p{color:var(--muted);font-size:.9rem}.meta{display:flex;justify-content:space-between;align-items:center;margin:1rem 0}.price{font:600 1.35rem/1 var(--serif)}.swatches{display:flex;gap:.4rem}.dot{width:18px;height:18px;border-radius:50%;background:var(--c);border:1px solid rgba(34,22,17,.2)}.card-actions{display:grid;grid-template-columns:1fr auto;gap:.6rem}.btn{min-height:44px;border:1px solid var(--ink);border-radius:999px;padding:0 1rem;transition:.26s var(--ease);display:inline-flex;align-items:center;justify-content:center}.btn.fill,.btn:hover{background:linear-gradient(135deg,var(--gold),var(--rose));border-color:transparent;color:white}.save{width:44px;border:1px solid var(--line);border-radius:50%}.save.saved{background:rgba(201,166,70,.2);border-color:var(--gold)}.drawer,.modal{position:fixed;z-index:70;background:linear-gradient(180deg,#fffaf5,var(--cream));box-shadow:0 30px 100px rgba(34,22,17,.25);transition:.36s var(--ease)}.overlay{position:fixed;inset:0;z-index:60;background:rgba(34,22,17,.45);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.3s}.overlay.show{opacity:1;pointer-events:auto}.drawer{top:0;right:0;width:min(410px,100%);height:100svh;padding:1.1rem;transform:translateX(105%);display:flex;flex-direction:column;gap:1rem}.drawer.open{transform:none}.modal{left:50%;top:50%;width:min(860px,94vw);max-height:86svh;overflow:auto;border-radius:18px;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none}.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:1rem}.top h3{font:600 2rem/1 var(--serif)}.close{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--paper)}.detail{display:grid;grid-template-columns:1fr 1fr}.detail .art{height:560px}.info{padding:clamp(1rem,4vw,2rem)}.option{margin:1.1rem 0}.label{display:flex;justify-content:space-between;margin-bottom:.6rem;font-size:.68rem;font-weight:800;letter-spacing:.15em;color:var(--rose);text-transform:uppercase}.pills{display:flex;gap:.55rem;flex-wrap:wrap}.pill{min-height:38px;min-width:56px;padding:0 .8rem;border:1px solid var(--line);border-radius:999px}.pill.active{border-color:var(--gold);background:rgba(201,166,70,.16)}.cart-line{display:grid;grid-template-columns:1fr auto;gap:.8rem;padding:.8rem 0;border-bottom:1px solid var(--line)}.cart-line small{color:var(--muted)}.total{margin-top:auto;display:flex;justify-content:space-between;font-weight:800}.toast{position:fixed;left:50%;bottom:1rem;z-index:90;transform:translate(-50%,18px);opacity:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:.8rem 1rem;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;transition:.28s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes float{50%{transform:translateY(-12px)}}@media(max-width:880px){.links{display:none}.hero{display:block}.hero p{margin-top:1rem}.grid{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}.detail .art{height:380px}}@media(max-width:560px){.nav{height:66px}.grid{grid-template-columns:1fr}.hero h1{font-size:clamp(3rem,16vw,4.8rem)}.art{height:280px}.modal{width:100%;height:100svh;max-height:none;border-radius:0}.drawer{width:100%}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="index.html">Avelie<span>Hair</span></a><nav class="links"><a href="index.html">Home</a><a href="#collections">Shop</a></nav><div class="nav-actions"><button class="icon" id="searchBtn" aria-label="Search products"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg></button><button class="icon" id="bagBtn" aria-label="Open bag"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1.2 13H6.2L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span class="count" id="bagCount">0</span></button></div></header>
<main><section class="hero"><h1>Collections</h1><p>Clean product cards. Tap a product for a full ecommerce detail view with shade, length, weight, save, and bag controls.</p></section><section class="bar" id="collections"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="clip">Clip-In</button><button class="filter" data-filter="tape">Tape-In</button><button class="filter" data-filter="halo">Halo</button></section><section class="grid" id="grid"></section></main>
<div class="overlay" id="overlay" hidden></div><aside class="drawer" id="drawer" aria-hidden="true"></aside><section class="modal" id="modal" aria-hidden="true"></section><div class="toast" id="toast" aria-live="polite"></div>
<script>
const products=[{name:"Mocha Luxe",kind:"clip",type:"Seamless Clip-In",price:329,grams:"180G",length:"20",colors:["#1d120c","#5a341f","#8b5d38"],swatches:[["Mocha","#2c160c"],["Espresso","#120b07"],["Caramel","#81512e"],["Honey","#b9834d"]],lengths:["16","18","20","22","24"],weights:["120G","160G","180G","220G"]},{name:"Caramel Melt",kind:"tape",type:"Soft Wave Tape-In",price:289,grams:"160G",length:"20",colors:["#3b2315","#88532e","#d2a06c"],swatches:[["Caramel","#8a5731"],["Mocha","#2c160c"],["Chestnut","#7c3f28"],["Honey","#b9834d"]],lengths:["16","18","20","22"],weights:["100G","140G","160G","200G"]},{name:"Honey Halo",kind:"halo",type:"Halo Crown Extension",price:259,grams:"140G",length:"18",colors:["#74502b","#b98143","#efd09a"],swatches:[["Honey","#b9834d"],["Caramel","#81512e"],["Sandy","#c29a63"],["Mocha","#2c160c"]],lengths:["14","16","18","20"],weights:["100G","120G","140G","180G"]},{name:"Espresso Silk",kind:"clip",type:"Classic Clip-In",price:319,grams:"180G",length:"22",colors:["#0f0907","#3b2418","#6b4128"],swatches:[["Espresso","#120b07"],["Mocha","#2c160c"],["Chestnut","#7c3f28"]],lengths:["18","20","22","24"],weights:["160G","180G","220G"]}];
let active=0,shade=0,len="",weight="",filter="all",toastTimer;const cart=[],saved=new Set,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function hair(p){return`<div class="hair" style="--lo:${p.colors[0]};--mid:${p.colors[1]};--hi:${p.colors[2]}"><i class="lock"></i><i class="lock"></i><i class="lock"></i><i class="lock"></i><i class="lock"></i></div>`}
function note(t){toast.textContent=t;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),1600)}
function render(){grid.innerHTML=products.map((p,i)=>({...p,i})).filter(p=>filter==="all"||p.kind===filter).map(p=>`<article class="card"><button class="art" data-open="${p.i}">${hair(p)}</button><div class="body"><div class="eyebrow">${p.type}</div><h2>${p.name}</h2><p>${p.length}\" / ${p.grams}</p><div class="meta"><span class="price">$${p.price}.00</span><div class="swatches">${p.swatches.slice(0,4).map(s=>`<i class="dot" style="--c:${s[1]}"></i>`).join("")}</div></div><div class="card-actions"><button class="btn fill" data-open="${p.i}">View Product</button><button class="save ${saved.has(p.name)?"saved":""}" data-save="${p.i}" aria-label="Save product">S</button></div></div></article>`).join("");$$("[data-open]").forEach(b=>b.onclick=()=>openProduct(+b.dataset.open));$$("[data-save]").forEach(b=>b.onclick=()=>toggleSave(+b.dataset.save))}
function showLayer(){overlay.hidden=false;requestAnimationFrame(()=>overlay.classList.add("show"))}
function closeAll(){drawer.classList.remove("open");modal.classList.remove("open");overlay.classList.remove("show");setTimeout(()=>overlay.hidden=true,280)}
function openProduct(i){active=i;const p=products[i];shade=0;len=p.length;weight=p.grams;showLayer();modal.innerHTML=`<div class="detail"><div class="art">${hair(p)}</div><div class="info"><div class="top"><h3>${p.name}</h3><button class="close" data-close>×</button></div><p>${p.type}</p><div class="meta"><span class="price">$${p.price}.00</span><button class="save ${saved.has(p.name)?"saved":""}" data-save-modal>Save</button></div><div class="option"><div class="label"><span>Shade</span><span id="shadeText">${p.swatches[0][0]}</span></div><div class="swatches">${p.swatches.map((s,n)=>`<button class="dot" style="--c:${s[1]}" data-shade="${n}" aria-label="${s[0]}"></button>`).join("")}</div></div><div class="option"><div class="label"><span>Length</span><span id="lenText">${len}\"</span></div><div class="pills">${p.lengths.map(v=>`<button class="pill len ${v===len?"active":""}" data-v="${v}">${v}\"</button>`).join("")}</div></div><div class="option"><div class="label"><span>Weight</span><span id="weightText">${weight}</span></div><div class="pills">${p.weights.map(v=>`<button class="pill weight ${v===weight?"active":""}" data-v="${v}">${v}</button>`).join("")}</div></div><button class="btn fill" id="addBag">Add To Bag</button></div></div>`;modal.classList.add("open");modal.setAttribute("aria-hidden","false");bindModal()}
function bindModal(){const p=products[active];$$("[data-shade]").forEach(b=>b.onclick=()=>{shade=+b.dataset.shade;shadeText.textContent=p.swatches[shade][0];note(`${p.swatches[shade][0]} selected`)});$$(".len").forEach(b=>b.onclick=()=>{len=b.dataset.v;$$(".len").forEach(x=>x.classList.remove("active"));b.classList.add("active");lenText.textContent=`${len}\"`});$$(".weight").forEach(b=>b.onclick=()=>{weight=b.dataset.v;$$(".weight").forEach(x=>x.classList.remove("active"));b.classList.add("active");weightText.textContent=weight});$("[data-close]").onclick=closeAll;$("[data-save-modal]").onclick=()=>toggleSave(active);addBag.onclick=()=>{cart.push({name:p.name,shade:p.swatches[shade][0],len,weight,price:p.price});updateBag();note(`${p.name} added`)}} 
function toggleSave(i){const p=products[i];saved.has(p.name)?saved.delete(p.name):saved.add(p.name);render();if(modal.classList.contains("open"))openProduct(i);note(saved.has(p.name)?"Saved":"Removed")}
function updateBag(){bagCount.textContent=cart.length;bagCount.style.display=cart.length?"grid":"none"}
function openBag(){showLayer();drawer.innerHTML=`<div class="top"><h3>Your Bag</h3><button class="close" data-close>×</button></div>${cart.length?cart.map((i,n)=>`<div class="cart-line"><div><strong>${i.name}</strong><br><small>${i.shade} / ${i.len}\" / ${i.weight}</small></div><button data-remove="${n}">×</button></div>`).join(""):"<p>Your bag is empty.</p>"}<div class="total"><span>Total</span><span>$${cart.reduce((n,i)=>n+i.price,0)}.00</span></div><button class="btn fill" id="checkout">Checkout Preview</button>`;drawer.classList.add("open");$("[data-close]").onclick=closeAll;$$("[data-remove]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);updateBag();openBag()});checkout.onclick=()=>note("Checkout ready")}
function openSearch(){showLayer();drawer.innerHTML=`<div class="top"><h3>Search</h3><button class="close" data-close>×</button></div><input class="search" id="search" placeholder="Search mocha, halo, tape" aria-label="Search"><div id="results"></div>`;drawer.classList.add("open");$("[data-close]").onclick=closeAll;search.oninput=()=>{const q=search.value.toLowerCase();results.innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)||p.type.toLowerCase().includes(q)||p.kind.includes(q)).map(p=>`<button class="cart-line" data-result="${products.indexOf(p)}"><strong>${p.name}</strong><span>$${p.price}</span></button>`).join("")};search.oninput();setTimeout(()=>search.focus(),50)}
$$(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});overlay.onclick=closeAll;bagBtn.onclick=openBag;searchBtn.onclick=openSearch;drawer.onclick=e=>{const r=e.target.closest("[data-result]");if(r){closeAll();openProduct(+r.dataset.result)}};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});render();updateBag();
</script>
</body>
</html>
